<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">web test</a>
            <span class="navbar-text text-muted">AI Agent Monitor</span>
        </div>
    </nav>

    <div class="container-fluid py-3">
        <!-- System Overview Cards -->
        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <div class="card stat-card" id="card-hermes">
                    <div class="card-body">
                        <h5 class="card-title">Hermes Agent</h5>
                        <div class="status-indicator" id="hermes-status"></div>
                        <p class="card-text"><small>Last: <span id="hermes-last">--</span></small></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card" id="card-ollama">
                    <div class="card-body">
                        <h5 class="card-title">Ollama</h5>
                        <div class="status-indicator" id="ollama-status"></div>
                        <p class="card-text"><small>Models: <span id="ollama-models">--</span></small></p>
                        <p class="card-text"><small>Last: <span id="ollama-last">--</span></small></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card" id="card-n8n">
                    <div class="card-body">
                        <h5 class="card-title">N8N</h5>
                        <div class="status-indicator" id="n8n-status"></div>
                        <p class="card-text"><small>Last: <span id="n8n-last">--</span></small></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card" id="card-system">
                    <div class="card-body">
                        <h5 class="card-title">System</h5>
                        <p class="card-text"><small>CPU: <span id="sys-cpu">--</span>%</small></p>
                        <p class="card-text"><small>RAM: <span id="sys-mem">--</span>%</small></p>
                        <p class="card-text"><small>Disk: <span id="sys-disk">--</span>%</small></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Panel -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary me-2" id="spawn-hermes-agent">Spawn Hermes Agent</button>
                        <button class="btn btn-success me-2" id="refresh-status">Refresh Status</button>
                        <button class="btn btn-outline-secondary" id="auto-refresh-btn">Disable Auto-Refresh</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Event Log -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Event Stream</h5>
                        <span id="event-count"></span>
                    </div>
                    <div class="card-body" style="max-height: 400px; overflow-y: auto;" id="event-log">
                        <div class="placeholder">Waiting for events...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-muted">
        <small>AI Agent Monitor &mdash; web test &copy; 2026</small>
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
